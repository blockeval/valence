simulation:
  seed: 14
  slots: 32
  record_events: false

validators:
  count: 128
  regions: [north_america, europe, asia, oceania]
  isps: [isp_a, isp_b, isp_c]
  stake_distribution: equal

topology:
  kind: ring_plus_random
  degree: 8

network:
  fanout: 4
  latency:
    distribution: lognormal
    mean_ms: 110
    sigma: 1.05
    jitter_phi: 0.85
    jitter_sigma_ms: 18
  loss:
    model: gilbert_elliott
    good_to_bad: 0.008
    bad_to_good: 0.18
    loss_good: 0.002
    loss_bad: 0.65
  shocks:
    - start_ms: 144000
      end_ms: 240000
      region: asia
      latency_multiplier: 2.5
      loss_addition: 0.08

resources:
  enabled: true
  outbound_bandwidth_mbps: 1000
  inbound_bandwidth_mbps: 1000
  processing_rate_mbps: 500
  processing_fixed_ms: 1

protocol:
  slot_duration_ms: 12000
  epoch_length_slots: 8
  committee_fraction: 0.25
  attestation_delay_ms: 4000
  attestation_deadline_ms: 8000
