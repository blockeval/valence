name: Feature request
description: Propose a model, metric, protocol, or reproducibility improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Research or engineering motivation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should it be tested or calibrated?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Relevant literature, traces, or implementations
