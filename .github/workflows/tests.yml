name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Compile source
        run: python -m compileall -q src scripts tests
      - name: Smoke run
        run: |
          valence validate configs/smoke.yaml
          valence run configs/smoke.yaml --output /tmp/valence-smoke
          valence validate configs/outage_demo.yaml
          valence run configs/outage_demo.yaml --output /tmp/valence-outage
